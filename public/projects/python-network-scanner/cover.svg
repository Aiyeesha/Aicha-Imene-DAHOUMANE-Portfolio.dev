<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="port-scanner : scan de 127.0.0.1 avec niveaux de risque et recommandations">
  <!-- Couverture de la carte portfolio : sortie réelle de port-scanner 1.1.0 sur un laboratoire local -->
  <rect width="1280" height="800" rx="12" fill="#0d1117"/>
  <rect width="1280" height="44" rx="12" fill="#161b22"/>
  <rect y="30" width="1280" height="14" fill="#161b22"/>
  <circle cx="24" cy="22" r="7" fill="#ff5f57"/><circle cx="48" cy="22" r="7" fill="#febc2e"/><circle cx="72" cy="22" r="7" fill="#28c840"/>
  <text x="640" y="28" font-family="ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#8b949e" text-anchor="middle">port-scanner 1.1.0 — TCP · asyncio · Blue Team</text>
  <g font-family="ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace" font-size="19">
    <text x="36" y="112"><tspan fill="#7ee787" font-weight="bold">$&#160;</tspan><tspan fill="#e6edf3">port-scanner&#160;127.0.0.1&#160;-p&#160;top100,6379&#160;--banners</tspan></text>
    <text x="36" y="172"><tspan fill="#e6edf3" font-weight="bold">127.0.0.1</tspan></text>
    <text x="36" y="202"><tspan fill="#8b949e">&#160;&#160;PORT&#160;&#160;&#160;&#160;&#160;&#160;ÉTAT&#160;&#160;&#160;&#160;&#160;&#160;SERVICE&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;RISQUE&#160;&#160;&#160;&#160;BANNIÈRE</tspan></text>
    <text x="36" y="232"><tspan fill="#e6edf3">&#160;&#160;22/tcp&#160;&#160;&#160;&#160;ouvert&#160;&#160;&#160;&#160;ssh&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#e3b341" font-weight="bold">moyen&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#79c0ff">SSH-2.0-OpenSSH_9.6p1&#160;Ubuntu-3ubuntu13</tspan></text>
    <text x="36" y="262"><tspan fill="#e6edf3">&#160;&#160;445/tcp&#160;&#160;&#160;ouvert&#160;&#160;&#160;&#160;smb&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#ff7b72" font-weight="bold">critique</tspan></text>
    <text x="36" y="292"><tspan fill="#e6edf3">&#160;&#160;3389/tcp&#160;&#160;ouvert&#160;&#160;&#160;&#160;rdp&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#ff7b72" font-weight="bold">critique</tspan></text>
    <text x="36" y="322"><tspan fill="#e6edf3">&#160;&#160;6379/tcp&#160;&#160;ouvert&#160;&#160;&#160;&#160;redis&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#ff7b72" font-weight="bold">critique</tspan></text>
    <text x="36" y="352"><tspan fill="#e6edf3">&#160;&#160;8080/tcp&#160;&#160;ouvert&#160;&#160;&#160;&#160;http-proxy&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#e3b341" font-weight="bold">moyen</tspan></text>
    <text x="36" y="412"><tspan fill="#e6edf3">1&#160;adresse(s)&#160;×&#160;101&#160;port(s)&#160;en&#160;2.01&#160;s&#160;—&#160;5&#160;ouvert(s),&#160;96&#160;fermé(s),&#160;0&#160;filtré(s).</tspan></text>
    <text x="36" y="472"><tspan fill="#e6edf3" font-weight="bold">Recommandations</tspan></text>
    <text x="36" y="502"><tspan fill="#e6edf3">&#160;&#160;[</tspan><tspan fill="#ff7b72" font-weight="bold">critique</tspan><tspan fill="#e6edf3">]&#160;rdp&#160;—&#160;Ne&#160;jamais&#160;exposer&#160;sur&#160;Internet&#160;:&#160;VPN&#160;ou&#160;passerelle&#160;RD,&#160;NLA&#160;et&#160;MFA.</tspan></text>
    <text x="36" y="532"><tspan fill="#e6edf3">&#160;&#160;[</tspan><tspan fill="#ff7b72" font-weight="bold">critique</tspan><tspan fill="#e6edf3">]&#160;redis&#160;—&#160;Lier&#160;à&#160;127.0.0.1,&#160;activer&#160;l'authentification&#160;(ACL)&#160;et&#160;le&#160;mode&#160;protégé.</tspan></text>
    <text x="36" y="562"><tspan fill="#e6edf3">&#160;&#160;[</tspan><tspan fill="#ff7b72" font-weight="bold">critique</tspan><tspan fill="#e6edf3">]&#160;smb&#160;—&#160;Jamais&#160;exposé&#160;sur&#160;Internet,&#160;SMBv1&#160;désactivé,&#160;signature&#160;SMB&#160;activée.</tspan></text>
    <text x="36" y="592"><tspan fill="#e6edf3">&#160;&#160;[</tspan><tspan fill="#e3b341" font-weight="bold">moyen</tspan><tspan fill="#e6edf3">]&#160;ssh&#160;—&#160;Clé&#160;uniquement,&#160;root&#160;interdit,&#160;accès&#160;restreint,&#160;anti-force&#160;brute.</tspan></text>
    <text x="36" y="652"><tspan fill="#7ee787" font-weight="bold">$&#160;</tspan><tspan fill="#e6edf3">port-scanner-web</tspan></text>
    <text x="36" y="682"><tspan fill="#8b949e">Interface&#160;disponible&#160;sur&#160;:&#160;http://127.0.0.1:8765/#token=••••••••</tspan></text>
  </g>
  <rect x="36" y="706" width="11" height="22" fill="#7ee787"/>
