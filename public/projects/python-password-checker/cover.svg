  <text x="22" y="394" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ccc" ></text>
  <text x="22" y="413" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#fff" font-weight="bold">  CRITÈRES</text>
  <text x="22" y="432" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#4ade80" >  ✓  Minuscules (a-z)</text>
