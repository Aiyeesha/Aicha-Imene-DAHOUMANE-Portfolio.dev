<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="password-checker : analyse d'un mot de passe faible, entropie effective et vérification des fuites">
  <!-- Couverture de la carte portfolio : sortie réelle de password-checker 1.1.0 (mot de passe d'exemple) -->
  <rect width="1280" height="800" rx="12" fill="#0d1117"/>
  <rect width="1280" height="44" rx="12" fill="#161b22"/>
  <rect y="30" width="1280" height="14" fill="#161b22"/>
  <circle cx="24" cy="22" r="7" fill="#ff5f57"/><circle cx="48" cy="22" r="7" fill="#febc2e"/><circle cx="72" cy="22" r="7" fill="#28c840"/>
  <text x="640" y="28" font-family="ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#8b949e" text-anchor="middle">password-checker 1.1.0 — entropie effective · k-anonymité · Blue Team</text>
  <g font-family="ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace" font-size="17">
    <text x="36" y="100"><tspan fill="#7ee787" font-weight="bold">$&#160;</tspan><tspan fill="#e6edf3">password-checker</tspan></text>
    <text x="36" y="131"><tspan fill="#8b949e">Mot&#160;de&#160;passe&#160;(saisie&#160;masquée)&#160;:&#160;</tspan></text>
    <text x="36" y="162"><tspan fill="#e6edf3" font-weight="bold">Analyse&#160;du&#160;mot&#160;de&#160;passe</tspan></text>
    <text x="36" y="193"><tspan fill="#e6edf3">&#160;&#160;Niveau&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;:&#160;</tspan><tspan fill="#ff7b72" font-weight="bold">TRÈS&#160;FAIBLE</tspan></text>
    <text x="36" y="224"><tspan fill="#e6edf3">&#160;&#160;Longueur&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;:&#160;13&#160;caractères</tspan></text>
    <text x="36" y="255"><tspan fill="#e6edf3">&#160;&#160;Familles&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;:&#160;chiffres,&#160;majuscules,&#160;minuscules,&#160;symboles</tspan></text>
    <text x="36" y="286"><tspan fill="#e6edf3">&#160;&#160;Entropie&#160;théorique&#160;:&#160;85.4&#160;bits</tspan></text>
    <text x="36" y="317"><tspan fill="#e6edf3">&#160;&#160;Entropie&#160;effective&#160;:&#160;45.8&#160;bits</tspan></text>
    <text x="36" y="348"><tspan fill="#e6edf3">&#160;&#160;Fuites&#160;(HIBP)&#160;&#160;&#160;&#160;&#160;&#160;:&#160;</tspan><tspan fill="#ff7b72" font-weight="bold">TROUVÉ&#160;dans&#160;521&#160;fuites&#160;connues</tspan></text>
    <text x="36" y="379"><tspan fill="#ff7b72">&#160;&#160;→&#160;Ce&#160;mot&#160;de&#160;passe&#160;est&#160;connu&#160;des&#160;attaquants&#160;:&#160;ne&#160;l&#x27;utilisez&#160;plus&#160;nulle&#160;part.</tspan></text>
    <text x="36" y="410"><tspan fill="#e6edf3" font-weight="bold">Conseils</tspan></text>
    <text x="36" y="441"><tspan fill="#e6edf3">&#160;&#160;-&#160;Contient&#160;un&#160;mot&#160;courant&#160;(même&#160;déguisé&#160;en&#160;leet&#160;speak,&#160;ex.&#160;«&#160;P@ssw0rd&#160;»).</tspan></text>
    <text x="36" y="472"><tspan fill="#e6edf3">&#160;&#160;-&#160;Moins&#160;de&#160;15&#160;caractères&#160;:&#160;c&#x27;est&#160;le&#160;minimum&#160;recommandé&#160;par&#160;le&#160;NIST&#160;quand&#160;il&#160;n&#x27;y&#160;a&#160;pas&#160;de&#160;double&#160;authentification.</tspan></text>
    <text x="36" y="503"><tspan fill="#e6edf3">&#160;&#160;-&#160;Entropie&#160;estimée&#160;à&#160;46&#160;bits,&#160;sous&#160;les&#160;80&#160;bits&#160;recommandés&#160;par&#160;la&#160;CNIL&#160;pour&#160;un&#160;mot&#160;de&#160;passe&#160;utilisé&#160;seul.</tspan></text>
    <text x="36" y="565"><tspan fill="#7ee787" font-weight="bold">$&#160;</tspan><tspan fill="#7ee787">█</tspan></text>
  </g>
</svg>
