  <!-- Title -->
  <text x="450" y="21" font-family="'Courier New',monospace" font-size="11" fill="#888" text-anchor="middle">password_checker.py</text>
  <text x="22" y="52" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ccc" ></text>
  <text x="22" y="71" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ffd33d" font-weight="bold">╔════════════════════════════════════╗</text>
  <text x="22" y="90" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ffd33d" font-weight="bold">║       🔑  PASSWORD  CHECKER        ║</text>
  <text x="22" y="109" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ffd33d" >║   Python • Regex • APIs • Security ║</text>
  <text x="22" y="128" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ffd33d" >╚════════════════════════════════════╝</text>
  <text x="22" y="147" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ccc" ></text>
  <text x="22" y="166" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#555" >  Votre mot de passe n'est PAS affiché à la saisie.</text>
  <text x="22" y="185" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#555" >  Pour l'API HaveIBeenPwned, seul un préfixe SHA-1 est envoyé.</text>
  <text x="22" y="204" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ccc" ></text>
  <text x="22" y="223" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#22d3ee" >  Entrez votre mot de passe : ••••••••••••••••</text>
  <text x="22" y="242" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ccc" ></text>
  <text x="22" y="261" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#444" >  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
  <text x="22" y="280" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#fff" font-weight="bold">  🔑  RÉSULTATS D'ANALYSE</text>
  <text x="22" y="299" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#444" >  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
  <text x="22" y="318" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ccc" ></text>
  <text x="22" y="337" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#22d3ee" font-weight="bold">  Force    :  ████████████████████████████░░  EXCELLENT  (82/100)</text>
  <text x="22" y="356" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#22d3ee" >  Entropie :  99 bits</text>
