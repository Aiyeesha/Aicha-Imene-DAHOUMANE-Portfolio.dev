  <text x="22" y="470" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#4ade80" >  ✓  Chiffres (0-9)</text>
  <text x="22" y="489" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#4ade80" >  ✓  Caractères spéciaux</text>
  <text x="22" y="508" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#4ade80" >  ✓  Longueur ≥ 8</text>
  <text x="22" y="527" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#4ade80" >  ✓  Longueur ≥ 12</text>
  <text x="22" y="546" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#4ade80" >  ✓  Longueur ≥ 16</text>
  <text x="22" y="565" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#4ade80" >  ✓  Pas de mot commun</text>
  <text x="22" y="584" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#4ade80" >  ✓  Pas de pattern séquentiel</text>
  <text x="22" y="603" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ccc" ></text>
  <text x="22" y="622" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#fff" font-weight="bold">  TEMPS DE CRACK ESTIMÉ (brute-force)</text>
