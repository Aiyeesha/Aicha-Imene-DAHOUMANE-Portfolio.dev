  <text x="22" y="660" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ffd700" >  GPU           (1 000 000/s):  3.2e+16 ans 🌌</text>
  <text x="22" y="679" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#ffd700" >  Cluster       (1 milliard/s): 3.2e+13 ans 🌌</text>
