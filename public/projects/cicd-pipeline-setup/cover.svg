<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070B1A"/>
      <stop offset="100%" style="stop-color:#0d1b2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow top-left -->
  <ellipse cx="200" cy="150" rx="300" ry="200" fill="#06b6d4" opacity="0.05"/>
  <!-- Ambient glow bottom-right -->
  <ellipse cx="1000" cy="480" rx="280" ry="180" fill="#0284c7" opacity="0.06"/>

  <!-- Pipeline: 4 stages connected by arrows -->
  <!-- Stage 1: Code -->
  <rect x="100" y="260" width="160" height="110" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <text x="180" y="308" font-family="monospace" font-size="28" fill="#06b6d4" text-anchor="middle" filter="url(#glow)">⌨</text>
  <text x="180" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Code</text>
  <text x="180" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle">Push</text>

  <!-- Arrow 1→2 -->
  <line x1="260" y1="315" x2="320" y2="315" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
  <polygon points="320,309 334,315 320,321" fill="#06b6d4" opacity="0.7"/>

  <!-- Stage 2: Validate -->
  <rect x="334" y="260" width="160" height="110" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <text x="414" y="308" font-family="monospace" font-size="28" fill="#06b6d4" text-anchor="middle" filter="url(#glow)">✓</text>
  <text x="414" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Validate</text>
  <text x="414" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle">Lint · Tests</text>

  <!-- Arrow 2→3 -->
  <line x1="494" y1="315" x2="554" y2="315" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
  <polygon points="554,309 568,315 554,321" fill="#06b6d4" opacity="0.7"/>

  <!-- Stage 3: Build -->
  <rect x="568" y="260" width="160" height="110" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" opacity="0.9"/>
  <text x="648" y="308" font-family="monospace" font-size="26" fill="#22d3ee" text-anchor="middle" filter="url(#glow)">⚙</text>
  <text x="648" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Build</text>
  <text x="648" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle">SFDX · Package</text>

  <!-- Arrow 3→4 -->
  <line x1="728" y1="315" x2="788" y2="315" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
  <polygon points="788,309 802,315 788,321" fill="#22d3ee" opacity="0.7"/>

  <!-- Stage 4: Deploy -->
  <rect x="802" y="260" width="160" height="110" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2" opacity="0.9"/>
  <text x="882" y="308" font-family="monospace" font-size="26" fill="#22d3ee" text-anchor="middle" filter="url(#glow)">🚀</text>
  <text x="882" y="338" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">Deploy</text>
  <text x="882" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle">Production Org</text>

  <!-- GitHub Actions badge -->
  <rect x="100" y="410" width="180" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <circle cx="120" cy="426" r="8" fill="#238636"/>
  <text x="134" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#7ee787">GitHub Actions</text>

  <!-- Salesforce CLI badge -->
  <rect x="296" y="410" width="170" height="32" rx="16" fill="#0f3460" stroke="#1e4a7a" stroke-width="1"/>
  <text x="381" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">Salesforce CLI</text>

  <!-- SFDX badge -->
  <rect x="480" y="410" width="100" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="530" y="431" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">SFDX · sf</text>

  <!-- Title -->
  <text x="600" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="700" fill="#f1f5f9" text-anchor="middle">Salesforce CI/CD Pipeline</text>
  <text x="600" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="#06b6d4" text-anchor="middle">GitHub Actions · Salesforce CLI · Automated Deployment</text>

  <!-- Bottom separator -->
  <line x1="100" y1="500" x2="1100" y2="500" stroke="#1e293b" stroke-width="1"/>
  <text x="100" y="530" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#475569">Salesforce · DevOps · CI/CD</text>
  <text x="1100" y="530" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#334155" text-anchor="end">Aïcha Imène DAHOUMANE</text>
</svg>
