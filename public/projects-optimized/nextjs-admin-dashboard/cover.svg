  <text x="342" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#06b6d4" filter="url(#glow)">24</text>

  <rect x="506" y="268" width="170" height="70" rx="8" fill="#0d1b2e" stroke="#1e293b" stroke-width="1"/>
