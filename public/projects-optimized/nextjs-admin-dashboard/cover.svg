  <text x="530" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">Track</text>
  <text x="660" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">Status</text>
  <text x="800" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">Actions</text>

  <rect x="322" y="388" width="738" height="28" rx="4" fill="#0a1628" opacity="0.4"/>
  <text x="336" y="407" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#94a3b8">Salesforce CI/CD Pipeline</text>
  <rect x="522" y="393" width="64" height="16" rx="8" fill="#06b6d440"/>
  <text x="554" y="405" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">Salesforce</text>
  <rect x="648" y="393" width="60" height="16" rx="8" fill="#10b98140"/>
  <text x="678" y="405" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Published</text>

  <rect x="322" y="422" width="738" height="28" rx="4" fill="#0d1b2e" opacity="0.3"/>
  <text x="336" y="441" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">Network Scanner</text>
