  <rect x="136" y="276" width="148" height="28" rx="6" fill="#06b6d4" opacity="0.15"/>
  <rect x="148" y="283" width="10" height="10" rx="2" fill="#06b6d4" opacity="0.7"/>
  <text x="168" y="293" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#06b6d4">Dashboard</text>
  <rect x="148" y="320" width="8" height="8" rx="1" fill="#475569"/>
