  <text x="549" y="439" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#10b981" text-anchor="middle">IT Ops</text>

  <rect x="322" y="452" width="738" height="28" rx="4" fill="#0a1628" opacity="0.4"/>
  <text x="336" y="471" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">Apex Batch Optimization</text>
  <rect x="522" y="457" width="64" height="16" rx="8" fill="#06b6d420"/>
  <text x="554" y="469" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">Salesforce</text>

  <!-- Title -->
  <text x="600" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="700" fill="#f1f5f9" text-anchor="middle">Next.js Admin Dashboard</text>
  <text x="600" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="#06b6d4" text-anchor="middle">Next.js 16 · Supabase · React 19 · TypeScript</text>

  <!-- Bottom -->
  <line x1="100" y1="562" x2="1100" y2="562" stroke="#1e293b" stroke-width="1"/>
  <text x="100" y="590" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#475569">Next.js · Supabase · Portfolio Admin</text>
  <text x="1100" y="590" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#334155" text-anchor="end">Aïcha Imène DAHOUMANE</text>
