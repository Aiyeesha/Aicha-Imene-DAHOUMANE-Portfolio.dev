  <text x="526" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#22d3ee" filter="url(#glow)">12</text>

  <rect x="690" y="268" width="170" height="70" rx="8" fill="#0d1b2e" stroke="#1e293b" stroke-width="1"/>
  <text x="710" y="292" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#475569">Uptime</text>
  <text x="710" y="322" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#10b981" filter="url(#glow)">99%</text>

