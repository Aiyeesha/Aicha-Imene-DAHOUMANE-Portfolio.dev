<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Linguaskill — Cambridge Assessment English">
  <title>Linguaskill — Cambridge Assessment English</title>

  <!-- Fond bleu Cambridge (#003C78 — couleur officielle Cambridge Assessment English) -->
  <rect width="200" height="200" rx="20" fill="#003C78"/>

  <!--
    Livre ouvert — symbole historique de Cambridge University Press.
    Deux pages symétriques + une reliure centrale.
    Positionné en haut de badge, centré.
  -->
  <g transform="translate(100, 74)">
    <!-- Page gauche -->
    <path
      fill="white"
      d="M -32,-20 L -4,-12 L -4,20 L -32,20 Q -37,20 -37,15 L -37,-15 Q -37,-20 -32,-20 Z"
    />
    <!-- Page droite -->
    <path
      fill="white"
      d="M 4,-12 L 32,-20 Q 37,-20 37,-15 L 37,15 Q 37,20 32,20 L 4,20 Z"
    />
    <!-- Reliure centrale -->
    <rect x="-4" y="-12" width="8" height="32" fill="#003C78" rx="2"/>
  </g>

  <!-- Séparateur horizontal subtil -->
  <rect x="30" y="117" width="140" height="1" fill="white" opacity="0.2" rx="0.5"/>

  <!-- "LINGUASKILL" — wordmark principal en blanc gras -->
  <text
    x="100"
    y="138"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="bold"
    text-anchor="middle"
    letter-spacing="0.8"
  >LINGUASKILL</text>

  <!-- Attribution Cambridge Assessment English (taille réduite, opacité atténuée) -->
  <text
    x="100"
    y="157"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    text-anchor="middle"
    opacity="0.72"
    letter-spacing="0.2"
  >Cambridge Assessment</text>
  <text
    x="100"
    y="169"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    text-anchor="middle"
    opacity="0.72"
    letter-spacing="0.2"
  >English</text>

  <!-- Pastille de niveau C1+ en bas à droite -->
  <rect x="134" y="176" width="46" height="18" rx="9" fill="#0075BE"/>
  <text
    x="157"
    y="188"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="bold"
    text-anchor="middle"
  >C1+</text>
</svg>
