name: CI

# ── Supply-chain security — SHA pinning ──────────────────────────────────────
# All third-party actions are pinned to their full immutable commit SHA.
# Mutable tags (v4, v6) can be silently redirected by a compromised maintainer;
# a SHA cannot be forged or reused for different content.
#
# Pinned versions (verified 2026-03-17 via GitHub API):
#   actions/checkout           de0fac2e4500dabe0009e67214ff5f5447ce83dd  v6.0.2
#   actions/setup-node         48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  v6.4.0
#   actions/upload-artifact    043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  v7.0.1
#   actions/download-artifact  3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  v8.0.1
#
# Dependabot (.github/dependabot.yml) opens monthly PRs to keep SHAs current.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  pull_request:

# ── Annulation automatique des runs obsolètes ────────────────────────────────
# Sans ce groupe, chaque push sur une PR crée un nouveau run en queue pendant
# que le précédent tourne encore — les runners s'accumulent et le dernier run
# attend parfois 5+ h. Avec cancel-in-progress: true, seul le run le plus
# récent continue ; les précédents sont annulés immédiatement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions par défaut restrictives au niveau workflow (recommandation Scorecard).
# Chaque job redéfinit uniquement ce dont il a besoin (contents: read).
permissions: read-all

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Permissions minimales — principe du moindre privilège.
    # contents:read : checkout du code uniquement.
    # Sans cette restriction, le GITHUB_TOKEN par défaut a des droits write
    # sur le repo (création de releases, push de code, etc.), ce qui élargit
    # la surface d'attaque en cas de compromission d'une action tierce.
    permissions:
      contents: read
    env:
      # Force les actions GitHub (checkout, upload-artifact) à utiliser Node 24
      # au lieu de Node 20 (déprécié depuis juin 2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Les secrets ne sont pas transmis aux PRs Dependabot par GitHub (sécurité).
      # On fournit des valeurs de fallback pour les variables publiques (NEXT_PUBLIC_*)
      # afin que `next build` n'échoue pas sur new URL('') au build statique.
      # Ces fallbacks sont de fausses URLs — aucune donnée sensible n'est exposée.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://localhost:3000' }}
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Portfolio' }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME || 'Portfolio' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD : évite que le postinstall de @playwright/test
        # télécharge/extrait partiellement le navigateur dans ~/.cache/ms-playwright.
        # Un zip partiel corrompt l'état et fait geler `playwright install` sur l'extraction.
        # L'installation explicite dans le job e2e démarre sur un état propre.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # Audit de sécurité des dépendances npm.
      # --audit-level=high : échoue uniquement sur les vulnérabilités HIGH et CRITICAL.
      # --production : ignore les devDependencies (non déployées sur Vercel).
      # Sans cette étape, des CVE connues peuvent être mergées sans alerte.
      - name: Security audit
        run: npm audit --audit-level=high --production

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      # Upload du build pour le job E2E (évite de rebuilder ~2 min supplémentaires)
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: next-build
          path: |
            .next/
            public/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Force les actions GitHub (checkout, upload-artifact) à utiliser Node 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Portfolio' }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME || 'Portfolio' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # Télécharge le build produit par build-test — évite un second `npm run build`
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: next-build
          path: .

      # CI : Chromium uniquement (Firefox testé en local).
      # Pas de timeout par step — le job-level timeout (60 min) est le filet de sécurité.
      # Des step timeouts trop courts tuaient le job avant que le download CDN (~167 MiB)
      # ne termine sur un runner lent.
      - name: Install Playwright system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # Conserver les rapports d'échec pour debug
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

