name: CI

# ── Supply-chain security — SHA pinning ──────────────────────────────────────
# All third-party actions are pinned to their full immutable commit SHA.
# Mutable tags (v4, v6) can be silently redirected by a compromised maintainer;
# a SHA cannot be forged or reused for different content.
#
# Pinned versions (verified 2026-03-17 via GitHub API):
#   actions/checkout           de0fac2e4500dabe0009e67214ff5f5447ce83dd  v6.0.2
#   actions/setup-node         48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  v6.4.0
#   actions/upload-artifact    043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  v7.0.1
#
# Dependabot (.github/dependabot.yml) opens monthly PRs to keep SHAs current.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  pull_request:

# ── Annulation automatique des runs obsolètes ────────────────────────────────
# Sans ce groupe, chaque push sur une PR crée un nouveau run en queue pendant
# que le précédent tourne encore — les runners s'accumulent et le dernier run
# attend parfois 5+ h. Avec cancel-in-progress: true, seul le run le plus
# récent continue ; les précédents sont annulés immédiatement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions par défaut restrictives au niveau workflow (recommandation Scorecard).
# Chaque job redéfinit uniquement ce dont il a besoin (contents: read).
permissions: read-all

jobs:
  # ── SEC-01 — Scan de secrets (gitleaks) ─────────────────────────────────────
  # Détecte les secrets committés par erreur (tokens Upstash, clés Supabase, etc.)
  # avant qu'ils n'atteignent main ou une branche déployée.
  # Exécuté en parallèle de build-test pour ne pas allonger le chemin critique.
  # Fetch-depth 0 requis pour scanner l'historique complet de la PR.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.22.1"
        # --retry-all-errors : la CDN des releases GitHub renvoie parfois des
        # 503/connexions coupées transitoires (observé 2 fois de suite le
        # 2026-08-12) ; -sSfL seul ne retente jamais. 5 tentatives, backoff
        # démarrant à 2s, sans quoi cette étape fait échouer tout le check
        # secret-scan sur un incident réseau sans rapport avec le contenu scanné.
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Detect secrets
        run: /tmp/gitleaks detect --source . --no-banner --config .gitleaks.toml

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Permissions minimales — principe du moindre privilège.
    # contents:read : checkout du code uniquement.
    # Sans cette restriction, le GITHUB_TOKEN par défaut a des droits write
    # sur le repo (création de releases, push de code, etc.), ce qui élargit
    # la surface d'attaque en cas de compromission d'une action tierce.
    permissions:
      contents: read
    env:
      # Force les actions GitHub (checkout, upload-artifact) à utiliser Node 24
      # au lieu de Node 20 (déprécié depuis juin 2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Les secrets ne sont pas transmis aux PRs Dependabot par GitHub (sécurité).
      # On fournit des valeurs de fallback pour les variables publiques (NEXT_PUBLIC_*)
      # afin que `next build` n'échoue pas sur new URL('') au build statique.
      # Ces fallbacks sont de fausses URLs — aucune donnée sensible n'est exposée.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://localhost:3000' }}
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Portfolio' }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME || 'Portfolio' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD : évite que le postinstall de @playwright/test
        # télécharge/extrait partiellement le navigateur dans ~/.cache/ms-playwright.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # Détection des dépendances fantômes : imports directs dans le code source
      # non déclarés dans package.json, résolus uniquement en transitif.
      # Uniquement "missing" (pas "unused") pour éviter les faux positifs sur les
      # packages de config (tailwind, eslint…). Exemple détecté : @radix-ui/react-dialog.
      - name: Ghost dependency check (depcheck)
        run: |
          npx --yes depcheck --ignores="server-only,playwright,mdx" --json 2>/dev/null > /tmp/depcheck.json || true
          node -e "
            const r = require('/tmp/depcheck.json');
            const missing = Object.keys(r.missing || {});
            if (missing.length > 0) {
              console.error('Dépendances fantômes détectées (importées mais absentes de package.json) :');
              missing.forEach(m => console.error(' •', m));
              process.exit(1);
            }
            console.log('Aucune dépendance fantôme.');
          "

      # Audit de sécurité des dépendances npm.
      # --audit-level=high : échoue uniquement sur les vulnérabilités HIGH et CRITICAL.
      # --omit=dev : ignore les devDependencies (non déployées sur Vercel).
      # --omit=optional : ignore les optionalDependencies. Nécessaire car next
      # embarque sharp en optionalDependency figée à ^0.34.5 (vulnérable, voir
      # scripts/fix-nested-sharp.mjs) ; npm n'applique pas nos overrides à une
      # optionalDependency imbriquée (limitation npm connue), donc cette entrée
      # reste dans package-lock.json quoi qu'on fasse. Le projet dépend déjà
      # directement d'une version corrigée de sharp (^0.35.3) au niveau racine,
      # et scripts/fix-nested-sharp.mjs supprime la copie imbriquée après install
      # pour que la résolution runtime utilise la version corrigée. --omit=optional
      # ne masque donc pas un vrai risque : il évite juste de bloquer la CI sur une
      # optionalDependency qu'on neutralise déjà autrement.
      # Sans cette étape, des CVE connues peuvent être mergées sans alerte.
      - name: Security audit
        run: npm audit --audit-level=high --omit=dev --omit=optional

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Verify SW route exists
        run: |
          test -f app/sw.js/route.ts || (echo "ERREUR : app/sw.js/route.ts manquant" && exit 1)
          test -f public/sw-template.js || (echo "ERREUR : public/sw-template.js manquant" && exit 1)
          echo "SW route OK"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Force les actions GitHub (checkout, upload-artifact) à utiliser Node 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Portfolio' }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME || 'Portfolio' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # Build requis par `npm run start` (next start cherche .next/BUILD_ID).
      # Le job build-test ne partage pas son build via artifact (l'extraction de
      # download-artifact@v8 dans path:. crée un sous-répertoire ./next-build/
      # au lieu de ./ — comportement v8 non rétrocompatible).
      - name: Build
        run: npm run build

      # CI : channel:'chrome' dans playwright.config.ts — Google Chrome pré-installé sur
      # ubuntu-latest (/usr/bin/google-chrome). Plus besoin de télécharger le Chromium
      # de Playwright (le CDN causait un gel systématique sur l'extraction).
      - name: Run E2E tests
        run: npm run test:e2e

      # Conserver les rapports d'échec pour debug
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Portfolio' }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME || 'Portfolio' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
