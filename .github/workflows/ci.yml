name: CI

# ── Supply-chain security note ────────────────────────────────────────────────
# GitHub Actions tags (v4, v6) are mutable — a compromised maintainer could
# push malicious code under the same tag.  Best practice is to pin every
# third-party action to its full immutable commit SHA.
#
# To generate pinned SHAs, run these commands once (requires gh CLI):
#
#   gh api repos/actions/checkout/git/ref/tags/v4   --jq '.object.sha'
#   gh api repos/actions/setup-node/git/ref/tags/v6 --jq '.object.sha'
#   gh api repos/actions/upload-artifact/git/ref/tags/v4 --jq '.object.sha'
#
# Then replace e.g. `uses: actions/checkout@v4` with:
#   uses: actions/checkout@<SHA>  # v4.x.x
#
# Dependabot (.github/dependabot.yml) is already configured to open monthly PRs
# for Actions updates — it will keep pinned SHAs up to date automatically once
# the initial pins are set.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Force les actions GitHub (checkout, upload-artifact) à utiliser Node 24
      # au lieu de Node 20 (déprécié depuis juin 2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      # Upload du build pour le job E2E (évite de rebuilder)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    env:
      # Force les actions GitHub (checkout, upload-artifact) à utiliser Node 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Rebuild en E2E — plus fiable que le partage d'artifact (évite les problèmes de path)
      - name: Build
        run: npm run build

      - name: Install Playwright browsers (Chromium uniquement)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # Conserver les rapports d'échec pour debug
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
