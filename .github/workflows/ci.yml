name: CI

# ── Supply-chain security — SHA pinning ──────────────────────────────────────
# All third-party actions are pinned to their full immutable commit SHA.
# Mutable tags (v4, v6) can be silently redirected by a compromised maintainer;
# a SHA cannot be forged or reused for different content.
#
# The pinned version is noted next to each `uses:`. Tools downloaded or run
# through npx are pinned to an exact version too, and the gitleaks binary is
# checked against its SHA-256.
#
# Dependabot (.github/dependabot.yml) opens monthly PRs to keep SHAs current.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  pull_request:

# ── Cancel superseded runs ───────────────────────────────────────────────────
# Each push to a PR would otherwise queue a new run while the previous one is
# still going; only the latest run continues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrictive default permissions (Scorecard recommendation); each job only
# asks for what it needs (contents: read).
permissions: read-all

jobs:
  # ── Secret scan (gitleaks) ──────────────────────────────────────────────────
  # Catches committed secrets (Upstash tokens, Supabase keys…) before they reach
  # main or a deployed branch. Runs alongside build-test; fetch-depth 0 to scan
  # the whole PR history.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.22.1"
          # Official checksum (gitleaks_8.22.1_checksums.txt from the release):
          # update it with the version. A tampered binary fails the step.
          GITLEAKS_SHA256: "2f92ab3b8e08319ac30836c32b90818e01519c3a4982771e4f45a7f5607872f7"
        # --retry-all-errors: the GitHub releases CDN sometimes returns transient
        # 503s or dropped connections, and -sSfL alone never retries. 5 attempts,
        # backoff from 2s, so a network blip does not fail the secret scan.
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Detect secrets
        run: /tmp/gitleaks detect --source . --no-banner --config .gitleaks.toml

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least privilege: contents: read for the checkout only. The default
    # GITHUB_TOKEN can write to the repo, widening the impact of a compromised
    # third-party action.
    permissions:
      contents: read
    env:
      # Run GitHub actions (checkout, upload-artifact) on Node 24 (Node 20 is
      # deprecated).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # GitHub does not pass secrets to Dependabot PRs: fake fallback URLs for
      # the public variables (NEXT_PUBLIC_*) keep `next build` from failing on
      # new URL(''). No sensitive data involved.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://localhost:3000' }}
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Portfolio' }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME || 'Portfolio' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: keeps @playwright/test's postinstall
        # from downloading or partially extracting a browser into ~/.cache.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # Phantom dependencies: direct imports missing from package.json and only
      # resolved transitively. "missing" only (not "unused"), to avoid false
      # positives on config packages (tailwind, eslint…).
      - name: Ghost dependency check (depcheck)
        run: |
          npx --yes depcheck@1.4.7 --ignores="server-only,playwright,mdx" --json 2>/dev/null > /tmp/depcheck.json || true
          node -e "
            const r = require('/tmp/depcheck.json');
            const missing = Object.keys(r.missing || {});
            if (missing.length > 0) {
              console.error('Dépendances fantômes détectées (importées mais absentes de package.json) :');
              missing.forEach(m => console.error(' •', m));
              process.exit(1);
            }
            console.log('Aucune dépendance fantôme.');
          "

      # npm dependency audit: fails on HIGH and CRITICAL only, ignoring
      # devDependencies (not deployed) and optionalDependencies. The latter is
      # needed because next pins sharp as a vulnerable optionalDependency that
      # npm overrides cannot reach; the project depends directly on a fixed
      # sharp and scripts/tooling/fix-nested-sharp.mjs removes the nested copy after
      # install, so no real risk is hidden.
      - name: Security audit
        run: npm audit --audit-level=high --omit=dev --omit=optional

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Verify SW route exists
        run: |
          test -f app/sw.js/route.ts || (echo "ERREUR : app/sw.js/route.ts manquant" && exit 1)
          test -f public/sw-template.js || (echo "ERREUR : public/sw-template.js manquant" && exit 1)
          echo "SW route OK"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Run GitHub actions (checkout, upload-artifact) on Node 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Portfolio' }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME || 'Portfolio' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # `npm run start` needs a build (.next/BUILD_ID). build-test does not share
      # its build as an artifact: download-artifact v8 extracts into a
      # ./next-build/ sub-directory instead of ./.
      - name: Build
        run: npm run build

      # playwright.config.ts uses channel 'chrome' in CI (Google Chrome is
      # preinstalled on ubuntu-latest), so no Playwright browser download.
      - name: Run E2E tests
        run: npm run test:e2e

      # Keep failure reports for debugging
      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'Portfolio' }}
      NEXT_PUBLIC_OG_NAME: ${{ secrets.NEXT_PUBLIC_OG_NAME || 'Portfolio' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun
