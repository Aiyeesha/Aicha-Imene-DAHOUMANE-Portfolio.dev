name: Drift Check

# ── Purpose ───────────────────────────────────────────────────────────────────
# Checks daily that Vercel production runs the HEAD commit of main (no drift),
# and warns when monitoring data (uptime cron) is older than 48h.
#
# Repository secrets:
#   VERCEL_TOKEN           — Vercel token (scope: read deployments)
#   NEXT_PUBLIC_SITE_URL   — site URL (e.g. https://aicha-imene-dahoumane-portfolio.vercel.app)
#
# The monitoring check (step 4) reads `lastStoredCheckAt` from GET /api/health;
# it is skipped when NEXT_PUBLIC_SITE_URL is not set.

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Print raw API responses for debugging"
        type: boolean
        default: false

# Least privilege (Scorecard): writes nothing to the repo, read-all is enough.
permissions: read-all

jobs:
  drift:
    name: Prod ↔ main drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      # ── 1. HEAD SHA of main ───────────────────────────────────────────────
      - name: Get main HEAD SHA
        id: main
        # Authenticated API through GITHUB_TOKEN: an anonymous `git ls-remote`
        # fails once the repository is private.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ -z "$SHA" ]; then
            echo "::error::Could not retrieve main HEAD SHA."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "main HEAD: $SHA"

      # ── 2. SHA of the latest production deployment ─────────────────────
      - name: Get prod deployment SHA (Vercel)
        id: prod
        env:
          # Input passed through env rather than interpolated into the script
          # (command injection hardening, flagged by OpenSSF Scorecard).
          DEBUG_OUTPUT: ${{ inputs.debug }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN is not configured — prod SHA check skipped."
            echo "sha=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Vercel project ids (not sensitive, visible through the Vercel API).
          PROJECT_ID="prj_tIRHa7TOHDBWWgyfnmLvBbBL3afG"
          TEAM_ID="team_ZSG4hmgl8QcadBdckxlLi7ls"

          RESPONSE=$(curl -sf \
            "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&teamId=${TEAM_ID}&target=production&state=READY&limit=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")

          if [ "${DEBUG_OUTPUT}" = "true" ]; then
            echo "Vercel API response: $RESPONSE"
          fi

          SHA=$(echo "$RESPONSE" | jq -r '.deployments[0].meta.githubCommitSha // empty')
          if [ -z "$SHA" ]; then
            echo "::error::Could not parse prod SHA from Vercel API response."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "prod SHA: $SHA"

      # ── 3. Compare production ↔ main ──────────────────────────────────────
      - name: Compare prod ↔ main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Skipped (VERCEL_TOKEN not configured)."
            exit 0
          fi

          MAIN="${{ steps.main.outputs.sha }}"
          PROD="${{ steps.prod.outputs.sha }}"

          if [ "$PROD" = "unknown" ]; then
            echo "Skipped (prod SHA unavailable)."
            exit 0
          fi

          if [ "$MAIN" != "$PROD" ]; then
            echo "::error::DRIFT DETECTED — prod ($PROD) != main ($MAIN)"
            echo "Production is not on main HEAD. Check the Vercel dashboard."
            exit 1
          fi

          echo "OK: prod == main ($MAIN)"

      # ── 4. Monitoring freshness (uptime cron) ─────────────────────────────
      # Reads lastStoredCheckAt from GET /api/health; data older than 48h only
      # raises a warning (not a failure).
      - name: Check monitoring freshness
        env:
          # Input passed through env rather than interpolated into the script
          # (command injection hardening, flagged by OpenSSF Scorecard).
          DEBUG_OUTPUT: ${{ inputs.debug }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::NEXT_PUBLIC_SITE_URL not configured — monitoring freshness check skipped."
            exit 0
          fi

          HEALTH=$(curl -sf --max-time 10 "${SITE_URL}/api/health" || echo "{}")

          if [ "${DEBUG_OUTPUT}" = "true" ]; then
            echo "Health API response: $HEALTH"
          fi

          LAST_CHECK=$(echo "$HEALTH" | jq -r '.lastStoredCheckAt // empty')

          if [ -z "$LAST_CHECK" ]; then
            echo "::warning::lastStoredCheckAt absent from /api/health — cron may never have run."
            exit 0
          fi

          # Age in hours (Linux date)
          LAST_CHECK_SEC=$(date -d "$LAST_CHECK" +%s 2>/dev/null || echo "0")
          NOW_SEC=$(date +%s)
          AGE_HOURS=$(( (NOW_SEC - LAST_CHECK_SEC) / 3600 ))

          echo "lastStoredCheckAt: $LAST_CHECK (${AGE_HOURS} h ago)"

          if [ "$AGE_HOURS" -gt 48 ]; then
            echo "::warning::Monitoring data is ${AGE_HOURS} h old (threshold: 48 h). The uptime cron may not have run recently."
          else
            echo "OK: monitoring data is ${AGE_HOURS} h old — within threshold."
          fi
