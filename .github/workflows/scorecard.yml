# .github/workflows/scorecard.yml
# --------------------------------
# OSSF Scorecard: automatic supply-chain security assessment, published to
# GitHub Security → Code Scanning and publicly at
# https://scorecard.dev/viewer/?uri=github.com/Aiyeesha/Aicha-Imene-DAHOUMANE-Portfolio.dev
# Checks branch protection, code review, signed commits, CI tests,
# dependency pinning, vulnerability disclosure, token permissions, SAST…
# Requires GitHub Advanced Security (free for public repos). Runs weekly and
# on every push to main.

name: OSSF Scorecard

on:
  schedule:
    # Mondays at 07:00 UTC
    - cron: "0 7 * * 1"
  push:
    branches:
      - main

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    permissions:
      # Needed to upload SARIF results to Code Scanning
      security-events: write
      # Needed for public repos (OIDC)
      id-token: write
      # Needed for checkout
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Token to read the repo and upload results
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Publish the score on scorecard.dev
          publish_results: true

      - name: Upload Scorecard results to Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard-results.sarif
          category: ossf-scorecard
