# .github/workflows/scorecard.yml
# --------------------------------
# OSSF Scorecard — évalue automatiquement le niveau de sécurité supply chain.
# Publie les résultats dans GitHub Security → Code Scanning (onglet Security).
#
# Score public visible sur : https://scorecard.dev/viewer/?uri=github.com/Aiyeesha/portfolio-next
#
# Critères analysés : branch protection, code review, signed commits, CI tests,
# dependency pinning, vulnerability disclosure, token permissions, SAST…
#
# Requis : GitHub Advanced Security activé sur le repo (gratuit pour les repos publics).
# Déclenché : chaque semaine + à chaque push sur main.

name: OSSF Scorecard

on:
  schedule:
    # Chaque lundi à 07h00 UTC
    - cron: "0 7 * * 1"
  push:
    branches:
      - main

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    permissions:
      # Requis pour uploader les résultats SARIF vers Code Scanning
      security-events: write
      # Requis pour les repos publics via OIDC
      id-token: write
      # Requis pour checkout
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Token requis pour accéder au repo et uploader les résultats
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Publie le score publiquement sur scorecard.dev
          publish_results: true

      - name: Upload Scorecard results to Code Scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: scorecard-results.sarif
          category: ossf-scorecard
