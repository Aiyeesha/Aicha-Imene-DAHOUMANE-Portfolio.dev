name: CodeQL

# ── Supply-chain security — SHA pinning ──────────────────────────────────────
# Toutes les actions sont épinglées à leur SHA immutable complet.
# SHA vérifié depuis scorecard.yml (github/codeql-action v4.36.0) :
#   actions/checkout              de0fac2e4500dabe0009e67214ff5f5447ce83dd  v6.0.2
#   github/codeql-action (init / autobuild / analyze / upload-sarif)
#                                 7211b7c8077ea37d8641b6271f6a365a22a5fbfa  v4.36.0
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque mardi à 08h00 UTC (décalé du scorecard pour répartir la charge)
    - cron: "0 8 * * 2"

# Permissions par défaut restrictives (recommandation Scorecard)
permissions: read-all

jobs:
  codeql:
    name: CodeQL SAST (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Requis pour uploader les résultats SARIF dans l'onglet Security
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          languages: javascript-typescript
          # Requêtes de sécurité + qualité (security-and-quality = union des deux suites)
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0

      - name: Analyze
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          category: "/language:javascript-typescript"
