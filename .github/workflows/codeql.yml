name: CodeQL

# ── Objectif ──────────────────────────────────────────────────────────────────
# SAST réel sur chaque push/PR vers main, plus un scan hebdomadaire de fond.
# Remplace le "default setup" GitHub qui s'était tu silencieusement (dernier
# run réel : 2026-06-17, sur une branche depuis supprimée) alors qu'OpenSSF
# Scorecard continuait de publier "SAST tool is not run on all commits" avec
# un score de 0/10 — audit du 2026-09-26.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 4 * * 1" # lundi 04:30 UTC

# Permissions par défaut en lecture seule au niveau workflow (Scorecard
# Token-Permissions) ; seul le job d'analyse reçoit security-events: write,
# nécessaire à l'upload SARIF vers Code Scanning.
permissions: read-all

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      # Actions épinglées par SHA complet (Scorecard Pinned-Dependencies),
      # mêmes versions que ci.yml et scorecard.yml ; Dependabot les tient à jour.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          category: "/language:javascript-typescript"
