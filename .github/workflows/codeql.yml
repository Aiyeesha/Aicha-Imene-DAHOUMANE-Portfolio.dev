name: CodeQL

# ── Purpose ───────────────────────────────────────────────────────────────────
# SAST on every push/PR to main, plus a weekly background scan. Replaces
# GitHub's "default setup", which had silently stopped running.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC

# Read-only default permissions (Scorecard Token-Permissions); only the
# analysis job gets security-events: write, needed to upload SARIF to Code
# Scanning.
permissions: read-all

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      # Actions pinned by full SHA (Scorecard Pinned-Dependencies), same
      # versions as ci.yml and scorecard.yml; Dependabot keeps them current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          category: "/language:javascript-typescript"
