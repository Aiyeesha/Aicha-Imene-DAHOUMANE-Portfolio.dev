name: Content Publish Safety

# ── Purpose ───────────────────────────────────────────────────────────────────
# Checks daily that the project content (content/projects.ts and
# content/projectDetails.ts) breaks neither publication rule:
#   1. No project published without a title in en, fr and es, otherwise the
#      FR or ES site silently diverges.
#   2. No SaaS product of the author (SAAS_EMBARGO_SLUGS in
#      lib/contentChecks.ts) is published or has a live URL before 2027.
#
# The same rules run on every pull request through
# __tests__/content-checks.test.ts; this scheduled run also catches the
# embargo date passing. No secret is needed (the former version read the
# Supabase copy, see scripts/archive/check-publish-safety-supabase.ts).

on:
  schedule:
    # Daily at 05:00 UTC, before drift-check.yml (06:00 UTC).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

# Least privilege (Scorecard): the workflow only reads the repository.
permissions: read-all

jobs:
  publish-safety:
    name: Publish safety (locale parity + SaaS embargo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # Installation runs without lifecycle scripts (none is needed).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        # --ignore-scripts: no dependency postinstall runs; the check script
        # (tsx) does not need any.
        run: npm ci --ignore-scripts

      - name: Run publish safety check
        run: npm run content:safety
