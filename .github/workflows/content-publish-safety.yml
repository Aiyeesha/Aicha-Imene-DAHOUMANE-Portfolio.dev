name: Content Publish Safety

# ── Purpose ───────────────────────────────────────────────────────────────────
# Checks daily that `public.projects` (Supabase) breaks neither publication
# rule:
#   1. No project published in one locale without the other two (en/fr/es,
#      or 'multi'), otherwise the ES site silently diverges.
#   2. No SaaS product of the author (orgdocs-saas, sfrelease-saas, and any
#      product added to SAAS_EMBARGO_SLUGS in the script) is `published` or
#      has a `live_url` before 2027; the schema does not enforce this.
#
# Unlike drift-check.yml, this check never skips when the secret is missing:
# content safety is its only purpose, so a silent skip would hide exactly
# what it exists to catch.
#
# Repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE_KEY — read-only use here, but the key itself can
#                               write: treat it as sensitive
# Also uses the existing NEXT_PUBLIC_SUPABASE_URL secret (ci.yml build-test).

on:
  schedule:
    # Daily at 05:00 UTC, before drift-check.yml (06:00 UTC).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

# Least privilege (Scorecard): the workflow writes nothing to the repo or to
# Supabase (read-only script).
permissions: read-all

jobs:
  publish-safety:
    name: Publish safety (locale parity + SaaS embargo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # The service_role key is only exposed to the two steps that read it (not
    # the whole job, where dependency postinstall scripts would see it during
    # `npm ci`), and installation runs without lifecycle scripts.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        # --ignore-scripts: no dependency postinstall runs; the check script
        # (tsx + supabase-js) does not need any.
        run: npm ci --ignore-scripts

      - name: Check secret is configured
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured in repo secrets."
            echo "This check exists to catch a real risk (SaaS products published"
            echo "early, or a locale silently missing on the ES site) — it fails"
            echo "loudly instead of skipping so the gap doesn't go unnoticed."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run publish safety check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run content:safety
