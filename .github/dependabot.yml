# .github/dependabot.yml
# -----------------------
# Dependabot — mise à jour automatique des dépendances.
#
# Stratégie :
#   - npm        : PRs hebdomadaires (lundi matin), groupées par catégorie
#   - github-actions : PRs mensuelles pour les actions CI
#
# Groupes npm :
#   - "next-ecosystem"  : Next.js + React + TypeScript (core — tester avant merge)
#   - "tailwind"        : Tailwind CSS + plugins
#   - "dev-tooling"     : ESLint, Jest, ts-jest, testing-library (dev only)
#   - "supabase-upstash": Backend (Supabase, Upstash Redis)
#   - toutes les autres deps sont mises à jour individuellement
#
# Chaque PR Dependabot déclenche le workflow CI (lint + typecheck + tests + build).
# Ne jamais activer `auto-merge` sans que le CI soit vert.

version: 2

updates:
  # ── npm ────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"                # package.json est à la racine du repo
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 8
    # Ignorer les majors automatiques — trop risqué sans review manuelle
    versioning-strategy: increase

    groups:
      # Core Next.js + React — tester soigneusement avant merge
      next-ecosystem:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "typescript"
          - "@types/node"

      # Tailwind CSS
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
          - "autoprefixer"

      # Outils de développement (ESLint, Jest, testing-library…)
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "jest*"
          - "ts-jest"
          - "@testing-library/*"
          - "@types/jest"
          - "typescript-eslint"

      # Backend Supabase + Upstash Redis
      supabase-upstash:
        patterns:
          - "@supabase/*"
          - "@upstash/*"

      # MDX pipeline
      mdx:
        patterns:
          - "@next/mdx"
          - "@mdx-js/*"
          - "remark*"
          - "rehype*"

    # Ne pas ouvrir de PR pour les packages marqués comme ignorés
    ignore:
      # next-intl : les majors peuvent casser l'API i18n — upgrade manuel
      - dependency-name: "next-intl"
        update-types: ["version-update:semver-major"]
      # framer-motion : les majors peuvent casser les animations — upgrade manuel
      - dependency-name: "framer-motion"
        update-types: ["version-update:semver-major"]
      # tailwindcss : la v4 change le plugin PostCSS (@tailwindcss/postcss) et
      # le format de config — migration manuelle requise, pas un simple bump
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]
      # eslint 10 : eslint-config-next@16.2.x embarque une version d'eslint-plugin-react
      # incompatible avec la nouvelle API de contexte des règles ESLint 10
      # (`react/display-name` casse avec `contextOrFilename.getFilename is not a function`).
      # À retirer quand eslint-config-next publiera une version stable pour ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
      # typescript 7 : ts-jest@29.4.11 déclare un peer-dependency `typescript@">=4.3 <7"`,
      # ce qui fait échouer `npm install` (ERESOLVE). À retirer quand ts-jest supportera TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node : doit rester aligné sur le pin Node "engines": "24.x" du package.json
      # (voir commit "Add homelab network sniffing project"). Les versions 25+ tracent
      # Node 25/26 et casseraient cet alignement.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
