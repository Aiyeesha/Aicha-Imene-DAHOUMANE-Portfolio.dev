# .github/dependabot.yml
# -----------------------
# Automatic dependency updates:
#   - npm: weekly PRs (Monday morning), grouped by category
#   - github-actions: monthly PRs for CI actions
#
# npm groups:
#   - "next-ecosystem"  : Next.js + React + TypeScript (core, test before merging)
#   - "tailwind"        : Tailwind CSS + plugins
#   - "dev-tooling"     : ESLint, Jest, ts-jest, testing-library (dev only)
#   - "supabase-upstash": backend (Supabase, Upstash Redis)
#   - every other dependency is updated on its own
#
# Every Dependabot PR runs the CI workflow (lint, typecheck, tests, build).
# Never enable auto-merge without green CI.

version: 2

updates:
  # ── npm ────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"                # package.json is at the repo root
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 8
    # No automatic majors: too risky without a manual review
    versioning-strategy: increase

    groups:
      # Core Next.js + React: test carefully before merging
      next-ecosystem:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "typescript"
          - "@types/node"

      # Tailwind CSS
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
          - "autoprefixer"

      # Development tools (ESLint, Jest, testing-library…)
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "jest*"
          - "ts-jest"
          - "@testing-library/*"
          - "@types/jest"
          - "typescript-eslint"

      # Supabase + Upstash Redis backend
      supabase-upstash:
        patterns:
          - "@supabase/*"
          - "@upstash/*"

      # MDX pipeline
      mdx:
        patterns:
          - "@next/mdx"
          - "@mdx-js/*"
          - "remark*"
          - "rehype*"

    # No PRs for ignored packages
    ignore:
      # next-intl: majors can break the i18n API, upgrade by hand
      - dependency-name: "next-intl"
        update-types: ["version-update:semver-major"]
      # framer-motion: majors can break animations, upgrade by hand
      - dependency-name: "framer-motion"
        update-types: ["version-update:semver-major"]
      # tailwindcss: a major changes the PostCSS plugin and config format,
      # which needs a manual migration
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]
      # eslint 10: eslint-config-next@16.2.x ships an eslint-plugin-react
      # incompatible with ESLint 10's rule context API (`react/display-name`
      # fails with `contextOrFilename.getFilename is not a function`). Remove
      # once eslint-config-next supports ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
      # typescript 7: ts-jest@29.4.11 has a `typescript@">=4.3 <7"` peer
      # dependency, so `npm install` fails (ERESOLVE). Remove once ts-jest supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node: must stay aligned with the Node "engines": "24.x" pin in
      # package.json; 25+ tracks Node 25/26.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      # CodeQL sub-actions (init, analyze, upload-sarif) must share a version:
      # analyze rejects a config file written by another version of init
      # ("Loaded a configuration file for version 'X', but running version
      # 'Y'"), so one PR per sub-action breaks CodeQL. They are grouped.
      codeql-action:
        patterns:
          - "github/codeql-action*"
